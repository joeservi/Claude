<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tower Defender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .overlay {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(5, 8, 18, 0.85); color: #e8eef7;
    font-family: -apple-system, system-ui, Arial, sans-serif; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #141b30; border: 1px solid #2a3a5c; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .panel h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
  .panel .sub { text-align: center; color: #8aa0c8; margin-bottom: 16px; font-size: 14px; }
  .coins { text-align: center; font-size: 20px; color: #ffd75e; font-weight: bold; margin-bottom: 16px; }
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .shop-col h3 { font-size: 14px; color: #8aa0c8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center; }
  .up {
    width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px;
    background: #1d2740; border: 1px solid #2a3a5c; border-radius: 10px;
    color: #e8eef7; cursor: pointer; transition: 0.12s; font-size: 13px;
  }
  .up:active { transform: scale(0.97); }
  .up:disabled { opacity: 0.4; cursor: not-allowed; }
  .up .name { font-weight: bold; display: block; }
  .up .lvl { color: #7fe0a0; font-size: 11px; }
  .up .cost { color: #ffd75e; float: right; font-weight: bold; }
  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #6366f1); color: white;
    font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 4px;
  }
  .btn:active { transform: scale(0.98); }
  .btn.danger { background: linear-gradient(135deg, #ef4444, #b91c1c); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="overlay" id="startScreen">
  <div class="panel">
    <h1>🏰 Tower Defender</h1>
    <div class="sub">Use the <b>horizontal joystick</b> at the bottom to aim & fire the turret.<br>Survive the waves. Spend coins to upgrade between rounds.</div>
    <button class="btn" id="startBtn">START</button>
  </div>
</div>

<div class="overlay" id="shopScreen">
  <div class="panel">
    <h1 id="shopTitle">Wave Cleared!</h1>
    <div class="sub" id="shopSub">Spend coins, then start the next wave.</div>
    <div class="coins">🪙 <span id="shopCoins">0</span></div>
    <div class="shop-grid">
      <div class="shop-col">
        <h3>⚔️ Offense</h3>
        <div id="offenseUpgrades"></div>
      </div>
      <div class="shop-col">
        <h3>🛡️ Defense</h3>
        <div id="defenseUpgrades"></div>
      </div>
    </div>
    <button class="btn" id="nextWaveBtn">START WAVE</button>
  </div>
</div>

<div class="overlay" id="gameOverScreen">
  <div class="panel">
    <h1>💀 Tower Destroyed</h1>
    <div class="sub" id="gameOverSub">You survived the onslaught for a while.</div>
    <div class="coins">Best Wave: <span id="bestWave">0</span></div>
    <button class="btn danger" id="restartBtn">TRY AGAIN</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---- Game State ----
  const State = { START: 0, PLAYING: 1, SHOP: 2, GAMEOVER: 3 };
  let state = State.START;

  const game = {
    wallY: 0,                       // wall position (near bottom)
    turretX: 0, turretY: 0,        // main turret (below wall, centered)
    coins: 0,
    wave: 0,
    bestWave: 0,
    maxHp: 100, hp: 100,
    hpRegen: 0,
    fireRate: 2.0,
    damage: 8,
    bulletSpeed: 540,
    autoTurrets: [],                // {x, y, cooldown}
    autoDamage: 5,
    autoFireRate: 1.0,
    lv: { fireRate:0, damage:0, autoTurret:0, autoPower:0, maxHp:0, regen:0 },
    diff: 0.9,
  };

  let bullets = [];
  let enemies = [];
  let particles = [];
  let floaters = [];

  let toSpawn = 0, spawnTimer = 0, spawnInterval = 0.85;
  let waveStartHp = 100;
  let waveClosestGap = Infinity;

  // ---- Horizontal Joystick ----
  const stick = {
    active: false, id: null,
    baseX: 0, y: 0,
    knobX: 0,
    restX: 0, restY: 0,
    width: 200, height: 50, deadzone: 0.22,
    mag: 0,
  };
  let aiming = false, aimAngle = Math.PI / 2;  // start pointing up
  let playerCooldown = 0;

  // ---- Upgrades ----
  const upgrades = {
    fireRate:   { name:'Fire Rate',    desc:'+25% turret fire rate', base:22, growth:1.5, max:20,
                  apply:()=>{ game.fireRate *= 1.25; } },
    damage:     { name:'Turret Damage',desc:'+35% turret damage', base:26, growth:1.5, max:30,
                  apply:()=>{ game.damage *= 1.35; } },
    autoTurret: { name:'Build Auto-Turret',desc:'Adds an auto-turret', base:55, growth:1.75, max:8,
                  apply:()=>{ addAutoTurret(); } },
    autoPower:  { name:'Auto-Turret Power',desc:'+35% auto dmg & rate', base:40, growth:1.55, max:25,
                  apply:()=>{ game.autoDamage*=1.35; game.autoFireRate*=1.20; } },
    maxHp:      { name:'Max HP',       desc:'+30 max HP (does NOT heal)', base:30, growth:1.45, max:40,
                  apply:()=>{ game.maxHp += 30; } },
    regen:      { name:'HP Regen',     desc:'+1.2 HP/sec', base:45, growth:1.55, max:20,
                  apply:()=>{ game.hpRegen += 1.2; } },
    repair:     { name:'Repair Tower', desc:'Restore 40 HP', repair:true, healAmount:40 },
  };
  function upgradeCost(key) {
    const u = upgrades[key];
    if (u.repair) return Math.round(18 * (1 + game.wave * 0.22));
    return Math.round(u.base * Math.pow(u.growth, game.lv[key]));
  }

  function addAutoTurret() {
    game.autoTurrets.push({ x: 0, y: 0, cooldown: 0 });
    layoutAutoTurrets();
  }

  function layoutAutoTurrets() {
    // 2 left, 2 right on the castle wall
    const count = game.autoTurrets.length;
    const spacing = 80;
    game.autoTurrets.forEach((t, i) => {
      if (i < 2) {
        // left side
        t.x = game.wallY - 80 - i * spacing;
        t.y = game.wallY - 20;
      } else {
        // right side
        t.x = W - (game.wallY - 80) + (i - 2) * spacing;
        t.y = game.wallY - 20;
      }
    });
  }

  // ---- Flow ----
  function resetGame() {
    game.wallY = H - 140;
    game.turretX = W / 2;
    game.turretY = game.wallY + 50;
    game.coins = 0; game.wave = 0;
    game.maxHp = 100; game.hp = 100; game.hpRegen = 0;
    game.fireRate = 2.0; game.damage = 8; game.bulletSpeed = 540;
    game.autoTurrets = []; game.autoDamage = 5; game.autoFireRate = 1.0;
    game.lv = { fireRate:0, damage:0, autoTurret:0, autoPower:0, maxHp:0, regen:0 };
    game.diff = 0.9;
    bullets = []; enemies = []; particles = []; floaters = [];
  }

  function startGame() { resetGame(); hideAll(); startWave(); }

  function startWave() {
    game.wallY = H - 140;
    game.turretX = W / 2;
    game.turretY = game.wallY + 50;
    game.wave++;
    game.bestWave = Math.max(game.bestWave, game.wave);
    toSpawn = Math.round(5 + game.wave * 1.5 + (game.diff - 1) * 4);
    toSpawn = Math.max(4, toSpawn);
    spawnTimer = 0;
    spawnInterval = Math.max(0.3, 0.9 - game.wave * 0.02);
    waveStartHp = game.hp;
    waveClosestGap = Infinity;
    state = State.PLAYING;
    hideAll();
  }

  function endWave() {
    const gap = Math.max(0, waveClosestGap === Infinity ? 400 : waveClosestGap);
    const proximityDanger = 1 - Math.min(1, gap / 220);
    const hpLostFrac = Math.max(0, (waveStartHp - game.hp)) / game.maxHp;
    const threat = Math.max(proximityDanger, hpLostFrac * 1.2);

    if (threat < 0.20) game.diff *= 1.15;
    else if (threat < 0.40) game.diff *= 1.08;
    else if (threat < 0.65) game.diff *= 1.02;
    else game.diff *= 0.95;
    game.diff = Math.max(0.8, Math.min(game.diff, 6));

    game.coins += 8 + game.wave * 3;
    state = State.SHOP;
    showShop();
  }

  function damageTower(amount) {
    game.hp -= amount;
    if (game.hp <= 0) { game.hp = 0; gameOver(); }
  }

  function gameOver() {
    state = State.GAMEOVER;
    aiming = false; stick.active = false; stick.id = null;
    document.getElementById('bestWave').textContent = game.bestWave;
    document.getElementById('gameOverSub').textContent =
      `You reached Wave ${game.wave}. The horde grew relentless.`;
    show('gameOverScreen');
  }

  // ---- Enemy Spawning ----
  function spawnEnemy() {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random()*W; y = -30; }
    else if (edge === 1) { x = W+30; y = Math.random()*H; }
    else if (edge === 2) { x = Math.random()*W; y = H+30; }
    else { x = -30; y = Math.random()*H; }

    const w = game.wave, d = game.diff;
    let type = 'grunt';
    const roll = Math.random();
    if (w >= 5 && roll < 0.15) type = 'tank';
    else if (w >= 3 && roll < 0.40) type = 'fast';

    let hp, speed, r, reward, color;
    if (type === 'tank') {
      hp = (34 + w*9) * d; speed = 26 + w*1.0; r = 22; reward = 7 + Math.floor(w*0.7); color = '#c0563f';
    } else if (type === 'fast') {
      hp = (8 + w*3) * d; speed = 66 + w*2.5; r = 11; reward = 4 + Math.floor(w*0.4); color = '#5ad6e0';
    } else {
      hp = (12 + w*4) * d; speed = 40 + w*1.6; r = 15; reward = 3 + Math.floor(w*0.4); color = '#9b8cff';
    }
    enemies.push({ x, y, hp, maxHp:hp, speed, r, reward, type, color, hitFlash:0 });
  }

  // ---- Firing ----
  function fireFromPlayer() {
    const c = Math.cos(aimAngle), s = Math.sin(aimAngle);
    const mx = game.turretX + c*24, my = game.turretY + s*24;
    bullets.push({ x:mx, y:my, vx:c*game.bulletSpeed, vy:s*game.bulletSpeed, dmg:game.damage, r:5, color:'#ffe27a', life:2 });
    spawnMuzzle(mx, my, c, s);
  }

  function fireAutoTurret(t) {
    let best = null, bestD = Infinity;
    for (const e of enemies) {
      const d = (e.x-t.x)**2 + (e.y-t.y)**2;
      if (d < bestD) { bestD = d; best = e; }
    }
    if (!best) return false;
    const dx = best.x - t.x, dy = best.y - t.y;
    const len = Math.hypot(dx, dy) || 1;
    bullets.push({ x:t.x, y:t.y, vx:dx/len*460, vy:dy/len*460, dmg:game.autoDamage, r:4, color:'#7fe0a0', life:2 });
    return true;
  }

  // ---- Particles ----
  function spawnHit(x, y, color) {
    for (let i=0;i<8;i++){ const a=Math.random()*Math.PI*2, s=40+Math.random()*120;
      particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.4, maxLife:0.4, color, size:2+Math.random()*2 }); }
  }
  function spawnDeath(x, y, color) {
    for (let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, s=60+Math.random()*180;
      particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.6, maxLife:0.6, color, size:2.5+Math.random()*3.5 }); }
  }
  function spawnMuzzle(x, y, dx, dy) {
    for (let i=0;i<5;i++){ const spread=(Math.random()-0.5)*0.7, a=Math.atan2(dy,dx)+spread, s=100+Math.random()*140;
      particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.2, maxLife:0.2, color:'#ffd75e', size:2.5 }); }
  }
  function addFloater(x,y,text,color){ floaters.push({x,y,text,life:0.8,color}); }

  // ---- Update ----
  function update(dt) {
    if (state !== State.PLAYING) return;

    if (game.hpRegen > 0 && game.hp < game.maxHp)
      game.hp = Math.min(game.maxHp, game.hp + game.hpRegen * dt);

    if (toSpawn > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); toSpawn--; spawnTimer = spawnInterval; }
    }

    playerCooldown -= dt;
    if (aiming && playerCooldown <= 0) { fireFromPlayer(); playerCooldown = 1 / game.fireRate; }

    for (const t of game.autoTurrets) {
      t.cooldown -= dt;
      if (t.cooldown <= 0) t.cooldown = fireAutoTurret(t) ? 1/game.autoFireRate : 0.1;
    }

    for (let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      if (b.life<=0 || b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){ bullets.splice(i,1); continue; }
      for (let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if ((b.x-e.x)**2 + (b.y-e.y)**2 <= (e.r+b.r)**2){
          e.hp -= b.dmg; e.hitFlash = 0.1; spawnHit(b.x, b.y, e.color);
          bullets.splice(i,1);
          if (e.hp <= 0){
            game.coins += e.reward; addFloater(e.x, e.y, '+'+e.reward, '#ffd75e');
            spawnDeath(e.x, e.y, e.color); enemies.splice(j,1);
          }
          break;
        }
      }
    }

    for (let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      const dx = game.turretX - e.x, dy = game.turretY - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      const gap = dist - 30 - e.r;  // 30 = turret radius
      if (gap < waveClosestGap) waveClosestGap = gap;
      if (dist > 30 + e.r - 4) {
        e.x += dx/dist * e.speed * dt; e.y += dy/dist * e.speed * dt;
      } else {
        damageTower(5 + game.wave * 0.5 + (e.type==='tank'?8:0));
        spawnDeath(e.x, e.y, e.color); enemies.splice(j,1);
      }
      if (e.hitFlash>0) e.hitFlash -= dt;
    }

    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
      if (p.life<=0) particles.splice(i,1);
    }
    for (let i=floaters.length-1;i>=0;i--){
      const f = floaters[i]; f.y -= 30*dt; f.life -= dt;
      if (f.life<=0) floaters.splice(i,1);
    }

    if (toSpawn === 0 && enemies.length === 0 && state === State.PLAYING) endWave();
  }

  // ---- Render ----
  function draw() {
    ctx.clearRect(0,0,W,H);
    // starfield background
    ctx.fillStyle = '#0a0e1a'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.6;
    for (let i=0; i<30; i++) {
      const sx = (i*723) % W, sy = (i*197) % H;
      ctx.fillStyle = i%2===0 ? 'rgba(100,150,200,0.3)' : 'rgba(80,120,180,0.2)';
      ctx.fillRect(sx, sy, 1, 1);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(40,55,90,0.15)'; ctx.lineWidth = 1;
    const g = 50; ctx.beginPath();
    for (let x=0;x<W;x+=g){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for (let y=0;y<H;y+=g){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();

    if (state === State.START) return;

    // draw tower structure (wall + main turret + auto turrets)
    drawTower();

    // enemies
    for (const e of enemies){
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
      ctx.fillStyle = e.hitFlash>0 ? '#ffffff' : e.color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.stroke();
      // hp bar
      if (e.hp < e.maxHp){
        const bw = e.r*2, f = Math.max(0,e.hp/e.maxHp);
        ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(e.x-e.r, e.y-e.r-8, bw, 4);
        ctx.fillStyle='#ff5e5e'; ctx.fillRect(e.x-e.r, e.y-e.r-8, bw*f, 4);
      }
    }

    // bullets
    for (const b of bullets){
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle=b.color; ctx.fill();
      // glow
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*2.5,0,Math.PI*2);
      ctx.fillStyle=b.color; ctx.fill();
      ctx.globalAlpha = 1;
    }

    // particles
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // floaters
    ctx.font = 'bold 18px system-ui, Arial';
    ctx.textAlign = 'center';
    for (const f of floaters){
      ctx.globalAlpha = Math.max(0, f.life/0.8);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'start';

    // horizontal joystick
    if (state === State.PLAYING) drawStick();

    // HUD
    ctx.fillStyle = '#e8eef7';
    ctx.font = 'bold 18px system-ui, Arial';
    ctx.fillText('Wave ' + game.wave, 16, 30);
    ctx.fillStyle = '#ffd75e';
    ctx.fillText('🪙 ' + game.coins, 16, 54);
    const hpFrac = game.hp/game.maxHp;
    ctx.fillStyle = hpFrac>0.25?'#7fe0a0':'#ef4444';
    ctx.fillText('❤ ' + Math.ceil(game.hp) + '/' + game.maxHp, 16, 78);
    ctx.fillStyle = '#8aa0c8';
    ctx.textAlign = 'right';
    ctx.fillText('Enemies: ' + (enemies.length + toSpawn), W-16, 30);
    ctx.textAlign = 'start';
  }

  function drawTower() {
    const hpFrac = game.hp/game.maxHp;

    // castle wall (horizontal bar across screen)
    ctx.fillStyle = '#3d4d66';
    ctx.fillRect(0, game.wallY, W, 40);
    // wall crenellations
    ctx.fillStyle = '#2a3a52';
    for (let i=0; i<Math.floor(W/30); i++) {
      const wx = i*30;
      ctx.fillRect(wx, game.wallY - 12, 15, 12);
    }
    // wall outline
    ctx.lineWidth = 2; ctx.strokeStyle = '#6b8ab8';
    ctx.strokeRect(0, game.wallY, W, 40);

    // HP bar (horizontal, below wall)
    const barH = 6;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, game.wallY + 42, W, barH);
    ctx.fillStyle = hpFrac>0.5?'#5ad67a':(hpFrac>0.25?'#ffd75e':'#ef4444');
    ctx.fillRect(0, game.wallY + 42, W * hpFrac, barH);
    ctx.lineWidth = 1; ctx.strokeStyle = '#6b8ab8';
    ctx.strokeRect(0, game.wallY + 42, W, barH);

    // main turret (centered below wall)
    const tw = 40, th = 50;
    ctx.fillStyle = '#e8a13e';
    ctx.fillRect(game.turretX - tw/2, game.turretY - th, tw, th);
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff2c4';
    ctx.strokeRect(game.turretX - tw/2, game.turretY - th, tw, th);

    // main turret barrel
    ctx.save(); ctx.translate(game.turretX, game.turretY - th/2);
    ctx.rotate(aimAngle);
    ctx.fillStyle = aiming ? '#ffe27a' : '#ffd75e';
    ctx.fillRect(0, -4, 32, 8);
    ctx.restore();

    // auto turrets on wall
    for (const t of game.autoTurrets){
      ctx.fillStyle = '#2f7f55';
      ctx.fillRect(t.x - 12, t.y - 12, 24, 24);
      ctx.lineWidth = 2; ctx.strokeStyle = '#7fe0a0';
      ctx.strokeRect(t.x - 12, t.y - 12, 24, 24);

      // turret barrel (point toward enemies or center)
      let angle = 0;
      let best = null, bestD = Infinity;
      for (const e of enemies) {
        const d = (e.x-t.x)**2 + (e.y-t.y)**2;
        if (d < bestD) { bestD = d; best = e; }
      }
      if (best) angle = Math.atan2(best.y - t.y, best.x - t.x);
      ctx.save(); ctx.translate(t.x, t.y);
      ctx.rotate(angle);
      ctx.fillStyle = '#5ad6a0';
      ctx.fillRect(2, -3, 14, 6);
      ctx.restore();
    }
  }

  function drawStick() {
    stick.restX = W / 2 - stick.width / 2;
    stick.restY = H - 60;

    const bx = stick.restX;
    const by = stick.restY;
    const kx = stick.active ? stick.knobX : stick.restX + stick.width / 2;
    const ky = stick.restY;

    // base
    ctx.globalAlpha = stick.active ? 0.55 : 0.3;
    ctx.fillStyle = '#1d2740';
    ctx.fillRect(bx, by, stick.width, stick.height);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#3b5a9c';
    ctx.strokeRect(bx, by, stick.width, stick.height);

    // knob (horizontal slider)
    ctx.globalAlpha = stick.active ? 1 : 0.6;
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(kx - 20, ky + stick.height/2 - 15, 40, 30);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#60a5fa';
    ctx.strokeRect(kx - 20, ky + stick.height/2 - 15, 40, 30);
    ctx.globalAlpha = 1;
  }

  // ---- Main Loop ----
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  // ---- Input (horizontal joystick) ----
  function getTouchById(e, id) {
    for (const t of e.changedTouches) if (t.identifier === id) return t;
    return null;
  }
  function startStick(x, y, id) {
    stick.active = true; stick.id = id;
    stick.baseX = stick.restX;
    updateStick(x);
  }
  function updateStick(x) {
    stick.restX = W / 2 - stick.width / 2;
    let dx = x - (stick.restX + stick.width / 2);
    const maxTravel = stick.width / 2;
    if (Math.abs(dx) > maxTravel) dx = Math.sign(dx) * maxTravel;
    stick.knobX = stick.restX + stick.width / 2 + dx;
    stick.mag = Math.min(1, Math.abs(dx) / maxTravel);
    if (stick.mag > stick.deadzone) {
      // MIRRORED: left (negative dx) = right angle, right (positive dx) = left angle
      aimAngle = Math.PI / 2 - (dx / maxTravel) * Math.PI * 0.5;
      aiming = true;
    } else { aiming = false; }
  }
  function endStick() {
    stick.active = false; stick.id = null; aiming = false;
  }

  function onTouchStart(e) {
    if (state !== State.PLAYING) return;
    e.preventDefault();
    if (stick.active) return;
    for (const t of e.changedTouches) {
      startStick(t.clientX, t.clientY, t.identifier);
      break;
    }
  }
  function onTouchMove(e) {
    if (!stick.active) return;
    e.preventDefault();
    const t = getTouchById(e, stick.id);
    if (t) updateStick(t.clientX);
  }
  function onTouchEnd(e) {
    if (!stick.active) return;
    if (getTouchById(e, stick.id)) endStick();
  }
  canvas.addEventListener('touchstart', onTouchStart, {passive:false});
  canvas.addEventListener('touchmove', onTouchMove, {passive:false});
  canvas.addEventListener('touchend', onTouchEnd);
  canvas.addEventListener('touchcancel', onTouchEnd);

  // mouse fallback
  canvas.addEventListener('mousedown', e => { if (state===State.PLAYING) startStick(e.clientX, e.clientY, 'mouse'); });
  canvas.addEventListener('mousemove', e => { if (stick.active) updateStick(e.clientX); });
  window.addEventListener('mouseup', () => { if (stick.active) endStick(); });

  // ---- UI ----
  function hideAll(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show')); }
  function show(id){ hideAll(); document.getElementById(id).classList.add('show'); }

  function showShop() {
    document.getElementById('shopTitle').textContent = `Wave ${game.wave} Cleared!`;
    document.getElementById('shopCoins').textContent = game.coins;
    renderUpgrades();
    show('shopScreen');
  }

  function renderUpgrades() {
    const offense = ['fireRate','damage'];
    if (game.autoTurrets.length > 0) {
      offense.push('autoTurret','autoPower');
    } else {
      offense.push('autoTurret');
    }
    const defense = ['maxHp','regen','repair'];
    const offEl = document.getElementById('offenseUpgrades');
    const defEl = document.getElementById('defenseUpgrades');
    offEl.innerHTML = ''; defEl.innerHTML = '';
    const build = (key, container) => {
      const u = upgrades[key];
      const cost = upgradeCost(key);
      const isRepair = !!u.repair;
      const isBuild = key === 'autoTurret';
      const lvl = isRepair || isBuild ? null : game.lv[key];
      const maxed = !isRepair && !isBuild && lvl >= u.max;
      const cantAfford = game.coins < cost;
      const repairFull = isRepair && game.hp >= game.maxHp;

      if (key === 'autoPower' && game.autoTurrets.length === 0) return;

      const btn = document.createElement('button');
      btn.className = 'up';
      btn.disabled = maxed || cantAfford || repairFull;
      const right = maxed ? 'MAX' : (repairFull ? 'FULL' : '🪙'+cost);
      let lvlLine;
      if (isRepair) {
        lvlLine = `<span class="lvl">${Math.ceil(game.hp)}/${game.maxHp} HP</span>`;
      } else if (isBuild) {
        lvlLine = `<span class="lvl">${game.autoTurrets.length}/${upgrades.autoTurret.max} built</span>`;
      } else {
        lvlLine = `<span class="lvl">Lv ${lvl}${maxed?'':' → '+(lvl+1)}</span>`;
      }
      btn.innerHTML = `<span class="cost">${right}</span>
        <span class="name">${u.name}</span>
        ${lvlLine}<br>
        <span style="color:#8aa0c8;font-size:11px">${u.desc}</span>`;
      btn.onclick = () => {
        const c = upgradeCost(key);
        if (game.coins < c) return;
        if (isRepair) {
          if (game.hp >= game.maxHp) return;
          game.coins -= c; game.hp = Math.min(game.maxHp, game.hp + u.healAmount);
        } else {
          if (isBuild && game.autoTurrets.length >= u.max) return;
          if (!isBuild && game.lv[key] >= u.max) return;
          game.coins -= c;
          if (isBuild) u.apply();
          else { game.lv[key]++; u.apply(); }
        }
        document.getElementById('shopCoins').textContent = game.coins;
        renderUpgrades();
      };
      container.appendChild(btn);
    };
    offense.forEach(k=>build(k, offEl));
    defense.forEach(k=>build(k, defEl));
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('restartBtn').onclick = startGame;
  document.getElementById('nextWaveBtn').onclick = startWave;

  resize();
  show('startScreen');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
